# Operations used by ScenarioService. Run `npm run codegen` after changing this file
# or server/src/schema.graphql to regenerate src/app/graphql/generated/.

query Scenarios {
  scenarios {
    id
    name
  }
}

query ScenarioDetail($id: ID!) {
  scenario(id: $id) {
    id
    name
    site {
      id
      name
      geojson
    }
    machines {
      id
      name
      type
      speedMps
      route {
        seq
        lat
        lon
      }
    }
  }
}

mutation CreateScenario($input: CreateScenarioInput!) {
  createScenario(input: $input) {
    id
    name
  }
}

mutation RenameScenario($id: ID!, $name: String!) {
  renameScenario(id: $id, name: $name) {
    id
    name
  }
}

mutation DeleteScenario($id: ID!) {
  deleteScenario(id: $id)
}

mutation AddMachine($scenarioId: ID!, $input: MachineInput!) {
  addMachine(scenarioId: $scenarioId, input: $input) {
    id
  }
}

mutation UpdateMachine($id: ID!, $input: UpdateMachineInput!) {
  updateMachine(id: $id, input: $input) {
    id
    name
    type
    speedMps
  }
}

mutation DeleteMachine($id: ID!) {
  deleteMachine(id: $id)
}
